[workspace]
resolver = "2"
members = ["crates/core", "crates/infra", "src-tauri"]

[workspace.package]
edition = "2021"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.21"
async-trait = "0.1.92"
indexmap = { version = "2.14.2", features = ["serde"] }
regex = "1.13.1"
sha2 = "0.11.0"
hex = "0.4.3"
html2text = "0.17.1"
tokio = { version = "1.53.1", features = ["full"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
keyring = { version = "3.6.3", features = ["windows-native"] }
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
tokio-rustls = "0.26.6"
webpki-roots = "1.0.9"
mail-parser = "0.11.9"
rand = "0.10.3"
base64 = "0.23.1"
url = "2.5.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
tauri = "2.12.0"
tauri-build = "2.7.0"
tauri-plugin-opener = "2.6.0"
wiremock = "0.6.5"
tempfile = "3.27.0"

academic-core = { path = "crates/core" }
academic-infra = { path = "crates/infra" }
